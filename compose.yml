services:
  app:
    container_name: dev-tdc-app
    build: .
    env_file: .env
    ports:
      - 5173:5173
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules

        - action: sync+restart
          path: svelte.config.js
          target: /app/svelte.config.js
        - action: sync+restart
          path: vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: .env
          target: /app/.env

        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: dev-tdc-db
    restart: unless-stopped
    env_file: .env
    ports:
      # Exposing port to run dev migrations
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 2s
      retries: 20

volumes:
  db-data:
    name: dev-tdc-data
